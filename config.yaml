# TARP Photogrammetry Dashboard Configuration
# Edit this file to match your Windows machine paths

base_path: "C:\\Users\\Photogrammetry"
dev_base_path: "/Users/ananth/Desktop/tarp-lab-test"

stage_folders:
  to_be_processed: "To Be Processed"
  to_be_aligned: "To Be Aligned"
  to_overnight: "To Overnight"
  processed: "Processed"
  uploaded_air: "Uploaded to AIR"

# Current season — update these two blocks once at the start of each season.
# season_year drives the "Season YYYY" label in the dashboard header.
season_year: 2026

# Trench range (inclusive) for the season above. Only folders nested inside a "Trench NNNNN"
# subfolder whose number falls in this range are scanned for jobs, run by the scripts, or
# flagged as misnamed. Folders at the stage-root / trench level and out-of-range trenches
# are ignored. For 2026: trenches 20000–23000.
current_year_trenches:
  min: 20000
  max: 23000

# Leave qgis / meshlab blank for auto-discovery
app_paths:
  metashape: "C:\\Program Files\\Agisoft\\Metashape Pro\\metashape.exe"
  cloudcompare: "C:\\Program Files\\CloudCompare\\CloudCompare.exe"
  qgis: ""
  meshlab: ""

# Headless Metashape pipeline scripts (run by the column "Run Alignment" / "Run Overnight" buttons).
# These are invoked once per job folder: metashape.exe -r <script> <job_folder> [<extra arg>]
scripts:
  alignment: "C:\\Users\\Photogrammetry\\To Be Processed\\TARP 2026 Alignment Script v2 - Headless.py"
  overnight: "C:\\Users\\Photogrammetry\\To Be Processed\\TARP 2026 Overnight Script - Headless.py"
  # REQUIRED for alignment — the 2026 GCP reference CSV. Alignment refuses to run until this is set.
  gcp_csv: "C:\\Users\\Photogrammetry\\To Be Processed\\GCPs 2026 20000-23000 EPSG32632 06-15-2026.csv"
  # Where the overnight script writes PLY / Orthos / DEM exports.
  overnight_output_assets_root: "C:/Users/Photogrammetry/GIS_2026"

  # Volume (CloudComPy) pipeline — set these to enable the Pre-Snip / Auto-Snip / Post-Snip buttons.
  # volume_script_dir is the working directory that contains Data/, example.json, etc.
  # cloudcompy_python is the Python 3.12 venv interpreter that has CloudComPy's deps installed.
  # cloudcompy_root is the extracted CloudComPy binary install (contains CloudCompare/ and
  # envCloudComPy.bat); the backend sets PYTHONPATH/PATH from it so `import cloudComPy` works
  # without shell activation — equivalent to running envCloudComPy.bat.
  pre_snip: "C:\\Users\\Photogrammetry\\cloudcomparescript\\pre_snip_script.py"
  auto_snip: "C:\\Users\\Photogrammetry\\cloudcomparescript\\auto_snip_script.py"
  post_snip: "C:\\Users\\Photogrammetry\\cloudcomparescript\\post_snip_script.py"
  create_su_sheet: "C:\\Users\\Photogrammetry\\AutomateSuSheetCreation\\generate_su_sheets.py"
  volume_script_dir: "C:\\Users\\Photogrammetry\\cloudcomparescript"
  cloudcompy_python: "C:\\Users\\Photogrammetry\\CloudComPy\\venv312\\Scripts\\python.exe"
  cloudcompy_root: "C:\\Users\\Photogrammetry\\CloudComPy\\CloudComPy312"
  # create_su_sheet is a QGIS script (not CloudComPy): launched via QGIS's bundled
  # Python so import qgis.core/processing works. create_su_sheet_dir is its repo dir
  # (cwd for the run); the dashboard writes su_sheets_input.json there.
  create_su_sheet_dir: "C:\\Users\\Photogrammetry\\AutomateSuSheetCreation"
  qgis_launcher: "C:\\Program Files\\QGIS 3.40.8\\bin\\python-qgis-ltr.bat"

# Google Sheets spreadsheet ID (from the URL: /spreadsheets/d/{ID}/edit)
gsheets_spreadsheet_id: "1r6TMtVEl6wIAAO8FNEXW1qkkFeAxumyyRsFSE4vHIwI"

# Server settings
host: "127.0.0.1"
port: 8000
